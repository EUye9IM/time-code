<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tmcode — Time Code Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a2e; border-radius: 12px; padding: 2rem; width: 100%; max-width: 420px; box-shadow: 0 0 30px rgba(0,0,0,.4); }
  h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1.5rem; color: #a78bfa; }
  label { font-size: .8rem; color: #888; display: block; margin-bottom: .3rem; }
  input, button { width: 100%; padding: .6rem .8rem; border-radius: 8px; border: 1px solid #333; background: #16213e; color: #eee; font-size: 1rem; font-family: monospace; outline: none; }
  input:focus { border-color: #a78bfa; }
  button { margin-top: .8rem; background: #a78bfa; color: #111; border: none; font-weight: 600; cursor: pointer; letter-spacing: .05em; }
  button:hover { background: #8b6fcf; }
  .result { margin-top: .8rem; padding: .6rem .8rem; border-radius: 8px; background: #0f3460; font-family: monospace; font-size: 1.1rem; min-height: 2.5rem; display: flex; align-items: center; word-break: break-all; }
  .section { margin-bottom: 1.5rem; }
  .switch { display: flex; gap: 0; margin-bottom: 1.5rem; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
  .switch button { flex: 1; margin: 0; border-radius: 0; background: transparent; color: #888; font-weight: 400; font-size: .85rem; }
  .switch button.active { background: #a78bfa; color: #111; }
  .status { text-align: center; font-size: .75rem; color: #666; margin-top: 1rem; }
  .status.ok { color: #4ade80; }
</style>
</head>
<body>

<div class="card">
  <h1>tmcode</h1>

  <div class="switch">
    <button id="tab-encode" class="active" onclick="switchTab('encode')">编码</button>
    <button id="tab-decode" onclick="switchTab('decode')">解码</button>
  </div>

  <div id="panel-encode" class="section">
    <label>日期时间 (本地时间)</label>
    <input type="datetime-local" id="dt-input">
    <button onclick="doEncode()">编码 → tmcode</button>
    <div class="result" id="encode-result"></div>
  </div>

  <div id="panel-decode" class="section" style="display:none">
    <label>tmcode 字符串 (4字符)</label>
    <input type="text" id="code-input" maxlength="4" placeholder="例如 4PZG">
    <label style="margin-top:.5rem">基准年份</label>
    <input type="number" id="base-year" placeholder="默认当前年份">
    <button onclick="doDecode()">解码 → 日期</button>
    <div class="result" id="decode-result"></div>
  </div>

  <div class="status" id="wasm-status">加载 WASM...</div>
</div>

<script src="wasm_exec.js"></script>
<script>
const go = new Go();

// Set default datetime to now
document.getElementById('dt-input').value = new Date().toISOString().slice(0, 16);
document.getElementById('base-year').value = new Date().getFullYear();

function switchTab(tab) {
  document.getElementById('tab-encode').classList.toggle('active', tab === 'encode');
  document.getElementById('tab-decode').classList.toggle('active', tab === 'decode');
  document.getElementById('panel-encode').style.display = tab === 'encode' ? '' : 'none';
  document.getElementById('panel-decode').style.display = tab === 'decode' ? '' : 'none';
}

function doEncode() {
  const val = document.getElementById('dt-input').value;
  if (!val) return;
  const ts = Math.floor(new Date(val).getTime() / 1000);
  document.getElementById('encode-result').textContent = tmcode_encode(ts);
}

function doDecode() {
  const code = document.getElementById('code-input').value.trim();
  if (!code || code.length !== 4) {
    document.getElementById('decode-result').textContent = '需要 4 个字符';
    return;
  }
  const baseYear = parseInt(document.getElementById('base-year').value) || new Date().getFullYear();
  const result = tmcode_decode(code, baseYear);
  if (typeof result === 'string' && result.startsWith('ERROR')) {
    document.getElementById('decode-result').textContent = result;
  } else {
    document.getElementById('decode-result').textContent = new Date(Number(result) * 1000).toLocaleString();
  }
}

async function init() {
  try {
    const resp = await fetch('tmcode.wasm');
    const { instance } = await WebAssembly.instantiateStreaming(resp, go.importObject);
    go.run(instance);
    document.getElementById('wasm-status').textContent = 'WASM 就绪 ✓';
    document.getElementById('wasm-status').classList.add('ok');
  } catch(e) {
    document.getElementById('wasm-status').textContent = '加载失败: ' + e.message;
  }
}

init();
</script>

</body>
</html>
